[package]
name = "shipsim_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shipsim"
path = "src/bin/shipsim.rs"
test = false

[[bin]]
name = "shipsim-sim"
path = "src/bin/shipsim-sim.rs"
test = false

[[bin]]
name = "shipsim-yard"
path = "src/bin/shipsim-yard.rs"
test = false

[[bin]]
name = "shipsim-budget"
path = "src/bin/shipsim-budget.rs"
test = false

[[bin]]
name = "shipsim-session"
path = "src/bin/shipsim-session.rs"
test = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
getrandom = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[profile.test]
panic = "unwind"
