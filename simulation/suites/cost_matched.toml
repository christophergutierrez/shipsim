# Equal-construction-budget fleet matchups using the standard yard costs.
#
#   cargo run --release --bin shipsim-sim -- \
#     --suite simulation/suites/cost_matched.toml \
#     --output tmp/simulation/reports/cost_matched.json

name = "cost-matched size fleets"
seeds = [1, 2, 3, 4, 5, 6, 7, 8]
max_turns = 60
max_orders = 60000
cost_tolerance = 100
stalemate_scoring = "damage_diff"
rubrics = [
  "simulation/rubrics/fleet-safety.toml",
  "simulation/rubrics/cost-matched.toml",
]

[map]
width = 24
height = 18
map_mode = "hard"

[[matchups]]
player = "greedy"
opponent = "aggressive"

[[matchups]]
player = "aggressive"
opponent = "defensive"

# 16×216 = 3456 vs yard_capital = 3470
[[engagements]]
name = "swarm_vs_titan"
player = [{ class = "yard_light_cruiser", count = 16 }]
opponent = [{ class = "yard_capital", count = 1 }]

# 3×309 = 927 vs 9×98 = 882
[[engagements]]
name = "heavies_vs_swarm"
player = [{ class = "yard_heavy_cruiser", count = 3 }]
opponent = [{ class = "yard_destroyer", count = 9 }]

# 2×546 = 1092 vs 11×98 = 1078
[[engagements]]
name = "battleships_vs_swarm"
player = [{ class = "yard_battleship", count = 2 }]
opponent = [{ class = "yard_destroyer", count = 11 }]

# 1322+2×98 = 1518 vs 5×309 = 1545
[[engagements]]
name = "dreadnought_screen_vs_heavies"
player = [
  { class = "yard_dreadnought", count = 1 },
  { class = "yard_destroyer", count = 2 },
]
opponent = [{ class = "yard_heavy_cruiser", count = 5 }]

[[engagements]]
name = "destroyer_mirror"
player = [{ class = "yard_destroyer", count = 4 }]
opponent = [{ class = "yard_destroyer", count = 4 }]
