# Equal-construction-budget fleet matchups using the standard yard costs.
#
#   cargo run --release --bin shipsim-sim -- \
#     --suite simulation/suites/cost_matched.toml \
#     --output tmp/simulation/reports/cost_matched.json

name = "cost-matched size fleets"
seeds = [1, 2, 3, 4, 5, 6, 7, 8]
max_turns = 60
max_orders = 60000
cost_tolerance = 100
stalemate_scoring = "damage_diff"
rubrics = [
  "simulation/rubrics/fleet-safety.toml",
  "simulation/rubrics/cost-matched.toml",
]

[map]
width = 40
height = 30
map_mode = "hard"

[[matchups]]
player = "greedy"
opponent = "aggressive"

[[matchups]]
player = "aggressive"
opponent = "defensive"

# 12×290 = 3480 vs basic_capital = 3578
[[engagements]]
name = "swarm_vs_titan"
player = [{ class = "basic_light_cruiser", count = 12 }]
opponent = [{ class = "basic_capital", count = 1 }]

# 3×665 = 1995 vs 17×117 = 1989
[[engagements]]
name = "heavies_vs_swarm"
player = [{ class = "basic_heavy_cruiser", count = 3 }]
opponent = [{ class = "basic_destroyer", count = 17 }]

# 2×1146 = 2292 vs 20×117 = 2340
[[engagements]]
name = "battleships_vs_swarm"
player = [{ class = "basic_battleship", count = 2 }]
opponent = [{ class = "basic_destroyer", count = 20 }]

# 1506+16×117 = 3378 vs 5×665 = 3325
[[engagements]]
name = "dreadnought_screen_vs_heavies"
player = [
  { class = "basic_dreadnought", count = 1 },
  { class = "basic_destroyer", count = 16 },
]
opponent = [{ class = "basic_heavy_cruiser", count = 5 }]

[[engagements]]
name = "destroyer_mirror"
player = [{ class = "basic_destroyer", count = 4 }]
opponent = [{ class = "basic_destroyer", count = 4 }]
