# Hull size tiers (shipsim).
#
# Ship class TOMLs use integer `size` = `id` below (1..=7).
# Combat to-hit still uses size-2 as the neutral baseline
# (`docs/combat-v2-tables.md`; `combat.accuracy.baseline_target_size` in
# `data/rules/default.toml`, ADR-0024 — not a Rust constant).
#
# FASA STCS "Class I–XX" from recognition manuals maps into these
# seven buckets (~3 source classes per tier). Role labels in source
# data (Scout, Frigate, …) are not size tiers — use class number when
# mapping scraped ships.
#
# Construction fields used by the component shipyard.
#
# Space / frame cost / base HP follow MOO's four-hull decades, spread across
# our seven ids. Sizes 1 / 3 / 5 / 7 are Small / Medium / Large / Huge;
# 2 / 4 / 6 are geometric midpoints. Values are ×2 vs the raw MOO Small
# (~10 space, 2 BC, 1 HP) so a fighter can still mount a compact gun.
# `defense` is MOO natural defense. Combat applies it relative to size 2
# (docs/combat-v2-tables.md) so small hulls are harder to hit while they
# move, huge hulls easier. `max_maneuver_actions` is battle path length,
# not galactic travel. Movement/SSD columns stay FASA-derived.

